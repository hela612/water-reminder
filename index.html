<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>喝水提醒</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0288d1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;min-height:100vh;overflow:hidden;background:linear-gradient(180deg,#b3e5fc,#0288d1)}
#bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
#bgOv{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(1,87,155,.10),rgba(2,136,209,.02) 45%,rgba(227,247,255,.08))}
.app{position:relative;z-index:1;background:rgba(255,255,255,.20);backdrop-filter:blur(14px);border-radius:28px;padding:24px;max-width:460px;width:100%;margin:auto;box-shadow:0 12px 48px rgba(2,136,209,.15);border:1px solid rgba(255,255,255,.45);max-height:92vh;overflow-y:auto}
h1{font-size:1.3em;color:#01579b;text-align:center;margin-bottom:2px}
.sub{text-align:center;color:#0288d1;font-size:.8em;margin-bottom:16px;opacity:.75}
.glass-wrap{position:relative;width:100px;height:140px;margin:0 auto 14px}
.glass{position:absolute;inset:0;border:3px solid rgba(79,195,247,.7);border-radius:6px 6px 32px 32px;overflow:hidden;background:rgba(227,247,255,.3)}
.wb{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(180deg,#4fc3f7cc,#0277bdcc);transition:height .8s cubic-bezier(.4,0,.2,1)}
.wb::before{content:"";position:absolute;top:-10px;left:-50%;width:200%;height:20px;background:#4fc3f7aa;border-radius:45%;animation:wave 4s linear infinite}
@keyframes wave{0%{transform:translateX(-25%) rotate(0)}100%{transform:translateX(25%) rotate(360deg)}}
.pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:700;color:#01579b;font-size:1.2em;z-index:2;pointer-events:none}
.stats{display:flex;justify-content:space-around;margin-bottom:14px;text-align:center}
.sn{font-size:1.3em;font-weight:700;color:#0277bd}
.sl{font-size:.7em;color:#0288d1;opacity:.7;margin-top:2px}
.st{font-size:.82em;font-weight:600;color:#0277bd;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.st::after{content:"";flex:1;height:1px;background:rgba(79,195,247,.25)}
.row{display:flex;gap:8px;margin-bottom:8px}
.f{flex:1}.f label{display:block;font-size:.72em;color:#0277bd;margin-bottom:3px;font-weight:500}
.f input{width:100%;padding:8px 9px;border:2px solid rgba(179,229,252,.5);border-radius:10px;font-size:.92em;background:rgba(255,255,255,.28);color:#01579b;outline:none;transition:border-color .2s}
.f input:focus{border-color:#4fc3f7;background:rgba(255,255,255,.55)}
.sl-list{max-height:180px;overflow-y:auto;border:1px solid rgba(179,229,252,.35);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.15)}
.si{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(179,229,252,.2);font-size:.85em}
.si:last-child{border-bottom:none}.si.done{opacity:.45}
.st-t{font-weight:600;color:#0277bd;min-width:48px}.st-a{color:#0288d1;opacity:.7;min-width:52px}
.sb{margin-left:auto;padding:4px 9px;border:none;border-radius:8px;font-size:.76em;cursor:pointer}
.sb-d{background:#4fc3f7;color:#fff}.sb-d:hover{background:#0288d1}
.sb-u{background:rgba(225,245,254,.45);color:#0277bd}.sb-u:hover{background:#81d4fa}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btns button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:12px;font-size:.85em;font-weight:600;cursor:pointer;transition:all .2s}
.bp{background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;box-shadow:0 4px 14px rgba(2,136,209,.35)}
.bp:hover{transform:translateY(-2px)}
.bs{background:rgba(225,245,254,.38);color:#0277bd}.bs:hover{background:rgba(179,229,252,.6)}
.bg2{background:transparent;color:#0288d1;border:1px solid rgba(179,229,252,.5)!important}.bg2:hover{background:rgba(179,229,252,.2)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);padding:11px 20px;border-radius:14px;font-size:.9em;z-index:99;transition:transform .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:90vw;backdrop-filter:blur(8px)}
.toast.show{transform:translateX(-50%) translateY(0)}
.ti{background:rgba(2,136,209,.9);color:#fff}.tw{background:rgba(239,108,0,.9);color:#fff}.td{background:rgba(46,125,50,.9);color:#fff}
.hn{margin-top:12px;padding:9px 12px;background:rgba(255,243,224,.6);border-left:3px solid #ffb74d;border-radius:0 10px 10px 0;font-size:.76em;color:#e65100;line-height:1.5;display:none}
.hn.show{display:block}
.tabs{display:flex;gap:0;border-radius:10px;overflow:hidden;margin-bottom:10px;border:2px solid rgba(179,229,252,.4)}
.tab{flex:1;padding:7px;text-align:center;font-size:.8em;font-weight:600;cursor:pointer;background:rgba(255,255,255,.22);color:#4fc3f7;transition:all .2s;border:none}
.tab.on{background:#4fc3f7;color:#fff}
/* Settings modal */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:rgba(255,255,255,.80);backdrop-filter:blur(20px);border-radius:22px;padding:24px;max-width:380px;width:90%;max-height:88vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.2);border:1px solid rgba(144,202,249,.4)}
.modal h2{font-size:1.05em;color:#01579b;margin-bottom:14px;text-align:center}
.opt-group{margin-bottom:14px}
.opt-group label{display:block;font-size:.78em;color:#0277bd;font-weight:600;margin-bottom:6px}
.opt-btns{display:flex;gap:6px;flex-wrap:wrap}
.opt-btns button{padding:8px 14px;border:2px solid rgba(179,229,252,.5);border-radius:10px;font-size:.85em;cursor:pointer;background:rgba(255,255,255,.25);color:#0277bd;transition:all .2s}
.opt-btns button.on{background:#4fc3f7;color:#fff;border-color:#4fc3f7}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lang-grid button{padding:9px;border:2px solid rgba(179,229,252,.5);border-radius:10px;font-size:.88em;cursor:pointer;background:rgba(255,255,255,.25);color:#0277bd;transition:all .2s}
.lang-grid button.on{background:#4fc3f7;color:#fff;border-color:#4fc3f7}
.modal .close-btn{width:100%;padding:10px;border:none;border-radius:12px;background:#0288d1;color:#fff;font-size:.9em;font-weight:600;cursor:pointer;margin-top:8px}
.modal .close-btn:hover{background:#0277bd}
.settings-btn{position:absolute;top:14px;right:14px;z-index:5;width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1em;transition:all .2s;border:1px solid rgba(179,229,252,.4)}
.settings-btn:hover{background:rgba(255,255,255,.45)}
.about{margin-top:12px;padding:9px 12px;background:rgba(225,245,254,.22);border-left:3px solid #4fc3f7;border-radius:0 10px 10px 0;font-size:.72em;color:#0277bd;line-height:1.6}
.about a{color:#0288d1;font-weight:600}
</style>
</head>

<script>
/* Audio: 水滴声开场 + 多风格环境音乐主体（Web Audio API 实时程序合成，CC0） */
var audioCtx=null,musicStyle=0,masterNow=null,liveOsc=[],liveTimers=[];
function ac(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function stopChime(){
liveTimers.forEach(function(id){clearTimeout(id)});liveTimers=[];
if(masterNow){try{masterNow.gain.cancelScheduledValues(audioCtx.currentTime);masterNow.gain.value=0;masterNow.disconnect()}catch(x){}masterNow=null}
liveOsc.forEach(function(o){try{o.stop(0)}catch(x){}});liveOsc=[]}

function tone(c,o,type,f,t,dur,vol,att){var os=c.createOscillator(),g=c.createGain();
os.type=type;os.frequency.setValueAtTime(f,t);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.02));g.gain.exponentialRampToValueAtTime(.0008,t+dur);
os.connect(g);g.connect(o);os.start(t);os.stop(t+dur+.05);liveOsc.push(os)}
function padChord(c,o,t,dur,fs,vol){for(var i=0;i<fs.length;i++)tone(c,o,"triangle",fs[i],t,dur,vol,1.3)}
function bowl(c,o,t,f){tone(c,o,"sine",f,t,6,.22,.01);tone(c,o,"sine",f*2.76,t,4,.06,.01);tone(c,o,"sine",f*5.4,t,2,.025,.01)}
function blip(c,o,t,f){var os=audioCtx.createOscillator(),g=audioCtx.createGain();os.type="sine";
os.frequency.setValueAtTime(f*1.02,t);os.frequency.exponentialRampToValueAtTime(f,t+.07);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+.14);
os.connect(g);g.connect(o);os.start(t);os.stop(t+.16);liveOsc.push(os)}
/* 水滴落水声：正弦波上滑音（经典"叮咚"水滴） */
function dropSound(c,o,t,vol){
function d(t0,f1,f2,v){var os=audioCtx.createOscillator(),g=audioCtx.createGain();os.type='sine';
os.frequency.setValueAtTime(f1,t0);os.frequency.exponentialRampToValueAtTime(f2,t0+.1);
g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.015);g.gain.exponentialRampToValueAtTime(.0008,t0+.3);
os.connect(g);g.connect(o);os.start(t0);os.stop(t0+.32);liveOsc.push(os)}

function closeSettings(){$("settingsModal").classList.remove("show")}

/* Core */
var slots=[],done=[],timer=null,running=false;
var $=function(id){return document.getElementById(id)};
function toSec(t){var p=t.split(":").map(Number);return(p[0]||0)*3600+(p[1]||0)*60+(p[2]||0)}
function toMin(t){return Math.floor(toSec(t)/60)}
function toTime(sec){sec=((sec%86400)+86400)%86400;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s2=sec%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s2).padStart(2,"0")}
function toast(msg,type,dur){var el=$("toast");el.textContent=msg;el.className="toast show t"+(type||"i");setTimeout(function(){el.classList.remove("show")},dur||4500)}
var dateMode=0;
function setDateMode(m){dateMode=m;
$("tabDaily").classList.toggle("on",m===0);
$("tabOnce").classList.toggle("on",m===1);
$("datePanel").style.display=m===1?"":"none";
if(running)scheduleNext()}
function isToday(){if(dateMode===0)return true;
var td=$("targetDate").value;if(!td)return false;
var now=new Date();
var target=td+"T00:00:00";
var d=new Date(target);
return d.toDateString()===now.toDateString()}
function setMode(m){$("tabM").classList.toggle("on",m===0);$("tabA").classList.toggle("on",m===1);$("manualPanel").style.display=m===0?"":"none";$("autoPanel").style.display=m===1?"":"none";if(m===1)autoDistribute()}
function onGoalChange(){initSlots();updateDisplay();renderSchedule();checkHealth()}
function onScheduleChange(){autoDistribute()}
function initSlots(){var g=Math.max(1,Math.min(20,+$("goalInput").value||8));while(slots.length<g)slots.push(toTime((480+slots.length*105)*60));slots.length=g;done=new Array(g).fill(false)}
function preAutoCheck(){}function autoDistribute(){var g=Math.max(1,Math.min(20,+$("goalInput").value||8));var s=toSec($("startT").value),e=toSec($("endT").value);var span=e>s?e-s:e+86400-s;var step=Math.max(5,Math.round(span/g));slots=[];for(var i=0;i<g;i++)slots.push(toTime(s+i*step));done=new Array(g).fill(false);renderSchedule();updateDisplay();checkHealth()}
function sortSlots(){var idx=slots.map(function(s,i){return{i:i,k:toSec(s)}});idx.sort(function(a,b){return a.k-b.k});slots=idx.map(function(x){return slots[x.i]});done=idx.map(function(x){return done[x.i]})}
function addSlot(){
var modal=document.createElement('div');
modal.style.cssText='position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center';
var box=document.createElement('div');
box.style.cssText='background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:18px;padding:22px;max-width:320px;width:88%;box-shadow:0 12px 40px rgba(0,0,0,.2)';
box.innerHTML='<div style="font-size:.9em;font-weight:600;color:#01579b;margin-bottom:12px;text-align:center">&#x23F1; &#x9009;&#x62E9;&#x65F6;&#x95F4;</div>';
var now=new Date();
var inp=document.createElement('input');inp.type='time';inp.step=1;inp.id='tp_time';
inp.value=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")+":00";
inp.style.cssText='width:100%;padding:10px;border:2px solid #b3e5fc;border-radius:12px;text-align:center;font-size:1.15em;color:#01579b;background:#fff';
box.appendChild(inp);
var btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:8px;margin-top:14px';
var okBtn=document.createElement('button');okBtn.textContent='OK';okBtn.style.cssText='flex:1;padding:10px;border:none;border-radius:12px;background:#0288d1;color:#fff;font-weight:600;cursor:pointer';
var cancelBtn=document.createElement('button');cancelBtn.textContent='X';cancelBtn.style.cssText='flex:1;padding:10px;border:none;border-radius:12px;background:#e1f5fe;color:#0277bd;font-weight:600;cursor:pointer';
btnRow.appendChild(okBtn);btnRow.appendChild(cancelBtn);box.appendChild(btnRow);
modal.appendChild(box);document.body.appendChild(modal);
cancelBtn.onclick=function(){document.body.removeChild(modal)};
okBtn.onclick=function(){
var v=document.getElementById('tp_time').value||"08:00:00";
if(v.length===5)v+=":00";
var total=toSec(v);
slots.push(toTime(total));done.push(false);sortSlots();$("goalInput").value=slots.length;
document.body.removeChild(modal);renderSchedule();updateDisplay();if(running)scheduleNext();
}}
function removeSlot(i){if(slots.length<=1)return;slots.splice(i,1);done.splice(i,1);$("goalInput").value=slots.length;renderSchedule();updateDisplay();checkHealth()}
var pendingZi=-1;
function showDrinkModal(i){
pendingZi=i;var ml=+$("cupMl").value||250;
$("dmTitle").textContent=t("timeUp");
$("dmCup").textContent=t("cupOf").replace("{n}",i+1).replace("{g}",slots.length);
$("dmMl").textContent=ml+" ml";
$("dmSip").textContent="💧 "+t("drinkBtn");
$("dmSnooze").textContent="⏰ "+t("snoozeBtn");
$("nextTime").textContent="--:--";
$("drinkModal").classList.add("show");
sysNotify(t("timeUp"),t("cupOf").replace("{n}",i+1).replace("{g}",slots.length)+" \u00B7 "+ml+" ml")}
function confirmDrink(){
var zi=pendingZi;pendingZi=-1;$("drinkModal").classList.remove("show");
if(zi>=0&&!done[zi]){var willFinish=done.filter(Boolean).length+1>=slots.length;drink(zi);if(!willFinish)toast(pickTip(),"d",6500)}
if(running)scheduleNext()}
function snoozeDrink(){
var zi=pendingZi;pendingZi=-1;$("drinkModal").classList.remove("show");stopChime();
if(zi>=0&&!done[zi]){var d=new Date(Date.now()+600000);
slots[zi]=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
renderSchedule();updateDisplay()}
if(running)scheduleNext()}
function drink(i){if(done[i])return;stopChime();if(pendingZi===i){pendingZi=-1;$("drinkModal").classList.remove("show")}done[i]=true;renderSchedule();updateDisplay();checkHealth();if(done.filter(Boolean).length>=slots.length){toast(t("goalDone"),"d");stopReminders()}}
function undrink(i){done[i]=false;renderSchedule();updateDisplay()}
function checkHealth(){
var d=done.filter(Boolean).length,ml=d*(+$("cupMl").value||250),g=slots.length,totalMl=g*(+$("cupMl").value||250);
var n=$("healthNote");
var msg="";
if(totalMl>4000){msg+="&#x26A0;&#xFE0F; \u6BCF\u65E5\u603B\u996E\u6C34\u91CF "+totalMl+" ml \u8D85\u8FC7\u5B89\u5168\u4E0A\u9650(4000ml)\uFF0C\u53EF\u80FD\u5BFC\u81F4\u4F4E\u94A0\u8840\u75C7\u3002<br>"}
if(g>1&&slots.length>1){
var s1=toSec(slots[0]),e1=toSec(slots[slots.length-1]);
var span=Math.abs(e1-s1);if(span<60)span+=86400;
var avgGap=span/(g-1);
if(avgGap<600){msg+="&#x26A0;&#xFE0F; \u559D\u6C34\u95F4\u9694\u4EC5 "+Math.round(avgGap/60)+" \u5206\u949F\uFF0C\u8FC7\u4E8E\u9891\u7E41\u3002\u5EFA\u8BAE\u95F4\u9694\u81F3\u5C11 30 \u5206\u949F\u3002<br>"}}
if(ml>3500){msg+="&#x26A0;&#xFE0F; \u4ECA\u65E5\u5DF2\u996E "+ml+" ml\uFF0C\u8BF7\u9002\u91CF\uFF0C\u4E0D\u5FC5\u5F3A\u6C42\u8FBE\u6807\u3002"}
else if(ml>2800&&d>=g*.8){msg+="&#x1F44D; \u63A5\u8FD1\u76EE\u6807\uFF01\u53E3\u6E34\u518D\u559D\u5373\u53EF\u3002"}
if(msg){n.innerHTML=msg;n.classList.add("show")}
else n.classList.remove("show")}

function checkScheduleHealth(){checkHealth()}
function renderSchedule(){var list=$("schedList");list.innerHTML="";
for(var i=0;i<slots.length;i++){var d=document.createElement("div");d.className="si"+(done[i]?" done":"");
d.innerHTML='<span class="st-t">'+slots[i]+'</span><span class="st-a">'+(+$("cupMl").value||250)+' ml</span>'+
(done[i]?'<button class="sb sb-u" onclick="undrink('+i+')">'+t("undo")+'</button>':'<button class="sb sb-d" onclick="drink('+i+')">'+t("drinkBtn")+'</button>')+
'<button class="sb sb-u" onclick="removeSlot('+i+')">\u00D7</button>';list.appendChild(d)}}
function updateDisplay(){var g=slots.length,d=done.filter(Boolean).length,ml=(+$("cupMl").value||250)*d;
$("goalNum").textContent=g;$("doneNum").textContent=d;$("mlNum").textContent=ml;
var p=g?Math.min(100,Math.round(d/g*100)):0;$("pctLabel").textContent=p+"%";$("waterBody").style.height=p+"%"}
function startReminders(){running=true;scheduleNext();toast(t("reminderOn"),"i")}
function stopReminders(){running=false;clearTimeout(timer);stopChime();pendingZi=-1;$("drinkModal").classList.remove("show");$("nextTime").textContent="--:--"}
function slotInRange(ts){var s=toSec($("startT").value),e=toSec($("endT").value);if(s<=e)return ts>=s&&ts<=e;return ts>=s||ts<=e}
function inRange(){
var s=toSec($("startT").value),e=toSec($("endT").value);
var now=new Date(),nm=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
if(s<=e)return nm>=s&&nm<=e;
return nm>=s||nm<=e}
function scheduleNext(){
clearTimeout(timer);
if(!isToday()){$("nextTime").textContent="\u975E\u4ECA\u65E5";return}
var now=new Date(),nm=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
/* Check if within drinking time range */
if(!inRange()){
  $("nextTime").textContent="--:--";
  /* Recheck every 30 seconds */
  timer=setTimeout(function(){if(running)scheduleNext()},30000);
  return}
var best=-1,bestDiff=Infinity;
for(var i=0;i<slots.length;i++){
  if(done[i])continue;
  var target=toSec(slots[i]);if(!slotInRange(target))continue;
  var diff=target-nm;
  if(diff<-30)diff+=86400;
  if(diff<0)diff=0;
  if(diff<bestDiff){bestDiff=diff;best=i}
}
if(best===-1){$("nextTime").textContent="--:--";return}
$("nextTime").textContent=slots[best];
(function(zi){
  timer=setTimeout(function(){
    if(!running)return;
    showDrinkModal(zi);
    notify();
  },bestDiff*1000);
})(best)
}
function resetAll(){stopReminders();done=new Array(slots.length).fill(false);$("healthNote").classList.remove("show");renderSchedule();updateDisplay();toast(t("resetMsg"),"i")}
function dlICS(L,name){var blob=new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"});
var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(a.href)},3000)}
function shareCfg(){
var cfg={s:slots,g:$("goalInput").value,c:$("cupMl").value,st:$("startT").value,e:$("endT").value,m:method,ms:musicStyle,l:lang,d:dateMode,td:$("targetDate").value};
var url=location.origin+location.pathname+"#cfg="+encodeURIComponent(JSON.stringify(cfg));
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(url).then(function(){toast(t("syncCopied"),"d",6000)},function(){toast(url,"i",9000)})}
else toast(url,"i",9000)}
function applyCfgFromHash(){
try{
if(location.hash.indexOf("#cfg=")!==0)return;
var cfg=JSON.parse(decodeURIComponent(location.hash.slice(5)));
if(cfg.s&&cfg.s.length){slots=cfg.s.slice();done=new Array(slots.length).fill(false)}
if(cfg.g)$("goalInput").value=cfg.g;
if(cfg.c)$("cupMl").value=cfg.c;
if(cfg.st)$("startT").value=cfg.st;
if(cfg.e)$("endT").value=cfg.e;
if(cfg.m!=null)setMethod(cfg.m,true);
if(cfg.ms!=null&&cfg.ms<=4)setMusicStyle(cfg.ms,true);
if(cfg.d!=null)setDateMode(cfg.d);
if(cfg.td)$("targetDate").value=cfg.td;
if(cfg.l&&I18N[cfg.l])setLang(cfg.l);
renderSchedule();updateDisplay();checkHealth();
history.replaceState(null,"",location.pathname);
toast(t("syncApplied"),"d",6000)
}catch(x){}}
function icsHead(){return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Water Reminder//ZH//","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Water Reminder",
"BEGIN:VTIMEZONE","TZID:Asia/Shanghai","BEGIN:STANDARD","DTSTART:19700101T000000","TZOFFSETFROM:+0800","TZOFFSETTO:+0800","TZNAME:CST","END:STANDARD","END:VTIMEZONE"]}
function icsStamp(){var u=new Date(),p=function(n){return String(n).padStart(2,"0")};
return String(u.getUTCFullYear())+p(u.getUTCMonth()+1)+p(u.getUTCDate())+"T"+p(u.getUTCHours())+p(u.getUTCMinutes())+p(u.getUTCSeconds())+"Z"}
function exportICS(){
var g=slots.length,ml=+$("cupMl").value||250,daily=dateMode===0;
var base;
if(daily)base=new Date();else{var td=$("targetDate").value;base=td?new Date(td+"T00:00:00"):new Date()}
var pad2=function(n){return String(n).padStart(2,"0")};
var db=String(base.getFullYear())+pad2(base.getMonth()+1)+pad2(base.getDate());
var L=icsHead(),st=icsStamp();
for(var i=0;i<g;i++){
var ts=slots[i].replace(/:/g,"");
L.push("BEGIN:VEVENT");
L.push("UID:water-"+db+"-"+i+"@waterreminder.local");
L.push("DTSTAMP:"+st);
L.push("DTSTART;TZID=Asia/Shanghai:"+db+"T"+ts);
if(daily)L.push("RRULE:FREQ=DAILY");
L.push("SUMMARY:"+t("icsTitle").replace("{n}",i+1).replace("{g}",g));
L.push("DESCRIPTION:"+t("icsDesc").replace("{ml}",ml));
L.push("BEGIN:VALARM","TRIGGER:-PT5M","ACTION:DISPLAY","DESCRIPTION:"+t("timeUp"),"END:VALARM");
L.push("BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:"+t("timeUp"),"END:VALARM");
L.push("END:VEVENT")}
L.push("END:VCALENDAR");
dlICS(L,"water-reminder.ics");
toast(t("exported"),"d",6000)}
